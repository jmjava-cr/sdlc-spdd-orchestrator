name: Test Retrieval Fixture Resolver

on:
  pull_request:
    paths:
      - 'examples/retrieval-fixture/**'
      - 'tests/test-retrieval-fixture-resolver.sh'
      - 'tests/fixtures/spike-001-retrieval-gold.tsv'
      - 'scripts/resolve-agent-context.sh'
  push:
    branches: [main]
    paths:
      - 'examples/retrieval-fixture/**'
      - 'tests/test-retrieval-fixture-resolver.sh'
      - 'tests/fixtures/spike-001-retrieval-gold.tsv'
      - 'scripts/resolve-agent-context.sh'

jobs:
  test-retrieval-fixture-resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SPIKE-001 retrieval fixture resolver gold test
        run: ./tests/test-retrieval-fixture-resolver.sh
