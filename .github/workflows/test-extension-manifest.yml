name: Test Extension Manifest

on:
  pull_request:
    paths:
      - 'scripts/resolve-agent-context.sh'
      - 'templates/agent-context/extensions/**'
      - 'tests/test-extension-manifest.sh'
      - '.github/workflows/test-extension-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/resolve-agent-context.sh'
      - 'templates/agent-context/extensions/**'
      - 'tests/test-extension-manifest.sh'
      - '.github/workflows/test-extension-manifest.yml'

jobs:
  test-extension-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run extension manifest tests
        run: ./tests/test-extension-manifest.sh
